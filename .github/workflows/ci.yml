name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; no step here needs to write to the repository.
permissions:
  contents: read

# A newer push to the same pull request supersedes the run in flight. Runs on
# main are never cancelled, so every merged commit keeps its own verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Playwright's guidance is not to cache browsers: restoring the cache takes
      # about as long as the download, and the OS packages cannot be cached.
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # One server, every gate that needs one. Kept in a single step on purpose:
      # a background process started with `&` surviving into a later step is a
      # runner implementation detail, not a guarantee.
      - name: Browser gates (a11y, interaction, motion, accent drift, print, links, smoke)
        run: |
          set -euo pipefail
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public
          PORT=3200 HOSTNAME=127.0.0.1 node .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:3200 >/dev/null && break; sleep 2; done
          curl -sf http://localhost:3200 >/dev/null || { echo "::error::The production server did not start within 80s (see server.log)."; exit 1; }
          export BASE_URL=http://localhost:3200

          echo "::group::Accessibility (axe, all routes × light/dark × 3 viewports)"
          npm run test:a11y
          echo "::endgroup::"

          echo "::group::Interaction contracts"
          npm run test:interaction
          echo "::endgroup::"

          echo "::group::Motion and reduced-motion contracts"
          npm run test:motion
          echo "::endgroup::"

          # Accent drift is invisible to axe and to the overflow sweep; a violet
          # section inside the lime theme shipped once because nothing looked.
          echo "::group::Accent drift — dark"
          THEME=dark npm run test:hue
          echo "::endgroup::"
          echo "::group::Accent drift — light"
          THEME=light npm run test:hue
          echo "::endgroup::"

          echo "::group::Print gate"
          npm run test:print
          echo "::endgroup::"

          echo "::group::Internal links and fragments"
          npm run test:links
          echo "::endgroup::"

          # The same smoke test can be pointed at a Vercel preview or production.
          echo "::group::Smoke test (every surface in a real browser)"
          npm run test:smoke
          echo "::endgroup::"

      - name: Lighthouse budgets and social-preview gate
        if: github.event_name == 'push' || github.base_ref == 'main'
        env:
          LIGHTHOUSE_RUNS: "3"
        run: npm run test:lighthouse

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            server.log
            .screenshots/
          if-no-files-found: ignore
          retention-days: 7
