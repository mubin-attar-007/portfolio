name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Accessibility gate (axe, all routes × light/dark)
        run: |
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public
          PORT=3200 HOSTNAME=127.0.0.1 node .next/standalone/server.js &
          for i in $(seq 1 40); do curl -sf http://localhost:3200 >/dev/null && break; sleep 2; done
          BASE_URL=http://localhost:3200 npm run test:a11y

      - name: Lighthouse budgets and social-preview gate
        if: github.event_name == 'push' || github.base_ref == 'main'
        env:
          LIGHTHOUSE_RUNS: "3"
        run: npm run test:lighthouse
